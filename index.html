<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Breakup Question</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-image: url('f1db80de-0f4a-4f84-82fb-25221831842b.png'); /* your uploaded photo */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 30px 50px;
            border-radius: 20px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 20px;
            margin: 10px 0;
            cursor: pointer;
        }
        input[type="radio"] {
            margin-right: 10px;
            transform: scale(1.5);
            cursor: pointer;
        }
        button {
            margin-top: 20px;
            background-color: #ff4081;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #e91e63;
        }
        #result {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hey, do you want breakup?</h1>

    <form id="breakupForm">
        <label><input type="radio" name="answer" value="Yes, I want breakup"> 1</label>
        <label><input type="radio" name="answer" value="No, I don't want breakup"> 2</label>
        <label><input type="radio" name="answer" value="Yes, I want breakup"> 3</label>
        <label><input type="radio" name="answer" value="No, I don't want breakup"> 4</label>
        <label><input type="radio" name="answer" value="Yes, I want breakup"> 5</label>
        <label><input type="radio" name="answer" value="No, I don't want breakup"> 6</label>

        <br>
        <button type="button" onclick="submitAnswer()">Submit</button>
    </form>

    <p id="result"></p>
</div>

<script>
    function submitAnswer() {
        const radios = document.getElementsByName('answer');
        let selectedValue = '';
        for (let radio of radios) {
            if (radio.checked) {
                selectedValue = radio.value;
                break;
            }
        }
        if (selectedValue) {
            document.getElementById('result').innerText = "You selected: " + selectedValue;
        } else {
            document.getElementById('result').innerText = "Please select an option!";
        }
    }
</script>

</body>
</html>
